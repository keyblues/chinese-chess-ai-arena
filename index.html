<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>观弈 · 模型对弈</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="seal" aria-hidden="true">弈</div>
        <div class="title-block">
          <h1>观弈</h1>
          <p>模型对弈 · 本地裁判</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="ghost-btn" id="btn-history" type="button">棋谱</button>
        <button class="ghost-btn" id="btn-settings" type="button">设置</button>
      </div>
    </header>

    <main class="workbench">
      <div class="arena">
        <!-- 双方名牌 -->
        <section class="plates">
          <div class="plate b" id="seat-b">
            <span class="badge badge-b" aria-hidden="true">黑</span>
            <div class="plate-main">
              <h2 id="name-b">黑方</h2>
              <p class="model" id="model-b"></p>
            </div>
            <span class="phase" id="phase-b">待开局</span>
            <div class="clock" id="clock-b">60:00</div>
          </div>
          <div class="plate r" id="seat-r">
            <span class="badge badge-r" aria-hidden="true">红</span>
            <div class="plate-main">
              <h2 id="name-r">红方</h2>
              <p class="model" id="model-r"></p>
            </div>
            <span class="phase" id="phase-r">待开局</span>
            <div class="clock" id="clock-r">60:00</div>
          </div>
        </section>

        <!-- 棋盘（结果印章直接盖在盘面上） -->
        <section class="board-frame">
          <div class="board-fit" id="board-fit">
            <div class="board" id="board"></div>
            <div class="banner" id="banner" hidden></div>
          </div>
        </section>

        <!-- 控制与棋谱绸带（合为一条） -->
        <section class="strip">
          <div class="controls">
            <button class="solid-btn" id="btn-start" type="button">开局</button>
            <button class="ghost-btn" id="btn-pause" type="button">暂停</button>
            <button class="ghost-btn" id="btn-stop" type="button">停局</button>
            <span class="review" id="review-bar" hidden>
              <span class="vsep" aria-hidden="true"></span>
              <button class="ghost-btn" id="btn-prev" type="button">上一手</button>
              <button class="ghost-btn" id="btn-next" type="button">下一手</button>
              <button class="ghost-btn" id="btn-exit-review" type="button">退出回看</button>
            </span>
            <button class="ghost-btn tb-end" id="btn-copy" type="button">复制棋谱</button>
          </div>
          <ol class="ribbon" id="movelist"></ol>
        </section>
      </div>

      <!-- 行棋日志坞 -->
      <aside class="dock" id="dock">
        <header class="dock-head">
          <span class="dock-dot" aria-hidden="true"></span>
          <h3>行棋日志</h3>
          <span class="dock-sub" id="dock-round"></span>
        </header>
        <div class="dock-body" id="dock-log"></div>
      </aside>
    </main>
  </div>

  <dialog id="settings">
    <form class="sheet" id="settings-form">
      <h3>对局设置</h3>
      <p class="hint">供应商档案和密钥只写进这台浏览器的 localStorage，不会进源码。红黑双方可选用不同供应商和模型；落子必须走工具调用，裁判不接受口头着法。</p>
      <div class="grid">
        <label>温度
          <input id="temperature" name="temperature" type="number" min="0" max="1.5" step="0.1" />
        </label>
        <label>每方时限（分钟）
          <input id="main-minutes" name="mainMinutes" type="number" min="1" max="180" step="1" />
        </label>
        <label>每步加秒
          <input id="increment" name="incrementSeconds" type="number" min="0" max="60" step="1" />
        </label>
      </div>
      <h4 class="section-title">供应商</h4>
      <div id="provider-rows"></div>
      <button class="ghost-btn" id="btn-add-provider" type="button">＋ 添加供应商</button>
      <div class="sides">
        <div class="side-box">
          <h4>红方</h4>
          <label>名称<input id="red-name" /></label>
          <label>供应商<select id="red-provider"></select></label>
          <label>模型<input id="red-model" list="model-list" /></label>
          <div class="pair">
            <label>上下文<input id="red-context" type="number" min="1024" /></label>
            <label>最大输出<input id="red-maxout" type="number" min="256" /></label>
          </div>
        </div>
        <div class="side-box">
          <h4>黑方</h4>
          <label>名称<input id="black-name" /></label>
          <label>供应商<select id="black-provider"></select></label>
          <label>模型<input id="black-model" list="model-list" /></label>
          <div class="pair">
            <label>上下文<input id="black-context" type="number" min="1024" /></label>
            <label>最大输出<input id="black-maxout" type="number" min="256" /></label>
          </div>
        </div>
      </div>
      <datalist id="model-list"></datalist>
      <p class="test-result" id="test-result"></p>
      <div class="sheet-actions">
        <button class="ghost-btn" id="btn-test" type="button">测试连接</button>
        <button class="ghost-btn" id="btn-close-settings" type="button">关闭</button>
        <button class="solid-btn" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="history">
    <div class="sheet">
      <h3>棋谱</h3>
      <p class="hint">最近 30 局保存在本地。进行中的对局不能把棋盘切去回看。</p>
      <ul class="history-list" id="history-list"></ul>
      <div class="sheet-actions">
        <button class="ghost-btn" id="btn-close-history" type="button">关闭</button>
      </div>
    </div>
  </dialog>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
